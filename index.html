<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SurveyGPT Check</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:#eef4ff;
}

header{
height:75px;
background:#2563eb;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.logo h1{
font-size:28px;
}

.logo p{
font-size:13px;
opacity:.9;
}

.menu{
font-size:32px;
cursor:pointer;
user-select:none;
}

.container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
padding:60px 15px;
}

.card{

width:420px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.card h2{
text-align:center;
margin-bottom:10px;
color:#2563eb;
}

.card p{
text-align:center;
margin-bottom:25px;
color:#666;
}

input{

width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;

}

button:hover{

background:#1d4ed8;

}

#welcome{

display:none;

}

footer{

background:#2563eb;
color:white;
text-align:center;
padding:18px;
margin-top:60px;

}

</style>

</head>

<body>

<header>

<div class="logo">

<h1>🔍 SurveyGPT Check</h1>

<p>Check Surveys. Save Time.</p>

</div>

<div class="menu">

☰

</div>

</header>

<div class="container">

<div class="card" id="login">

<h2>Welcome</h2>

<p>Please enter your name and email.</p>

<input id="name" placeholder="Your Name">

<input id="email" placeholder="Your Email">

<button onclick="login()">Continue</button>

</div>

<div class="card" id="welcome">

<h2 id="username"></h2>

<p>

Find surveys that are not recommended before wasting your valuable time.

</p>

<button onclick="window.location='survey-list.html'">

Go To Survey List

</button>

</div>

</div>

<footer>

© 2026 SurveyGPT Check | Check Surveys. Save Time.

</footer>
<script>

// Login

function login(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();

if(name=="" || email==""){

alert("Please enter your name and email.");
return;

}

localStorage.setItem("username",name);
localStorage.setItem("useremail",email);

showWelcome();

}

// Welcome Screen

function showWelcome(){

let name=localStorage.getItem("username");

document.getElementById("login").style.display="none";
document.getElementById("welcome").style.display="block";

document.getElementById("username").innerHTML="Welcome, "+name+" 👋";

}

// Check Existing User

if(localStorage.getItem("username")){

showWelcome();

}

// Sidebar

const menu=document.querySelector(".menu");

menu.onclick=function(){

let side=document.getElementById("sidebar");

if(side.style.right=="0px"){

side.style.right="-280px";

}else{

side.style.right="0px";

}

}

// Logout

function logout(){

localStorage.clear();

location.reload();

}

</script>

<div id="sidebar" style="
position:fixed;
top:0;
right:-280px;
width:260px;
height:100%;
background:white;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
transition:.3s;
z-index:999;
">

<div style="
background:#2563eb;
color:white;
padding:20px;
font-size:22px;
font-weight:bold;
">

SurveyGPT Check

</div>

<a href="index.html" style="display:block;padding:15px;text-decoration:none;color:#333;border-bottom:1px solid #eee;">🏠 Home</a>

<a href="survey-list.html" style="display:block;padding:15px;text-decoration:none;color:#333;border-bottom:1px solid #eee;">📋 Survey List</a>

<a href="#" style="display:block;padding:15px;text-decoration:none;color:#333;border-bottom:1px solid #eee;"
onclick="alert('Name : '+localStorage.getItem('username')+'\nEmail : '+localStorage.getItem('useremail'));">
👤 Account
</a>

<a href="#" style="display:block;padding:15px;text-decoration:none;color:red;"
onclick="logout()">
🚪 Logout
</a>

</div>

</body>
</html>
