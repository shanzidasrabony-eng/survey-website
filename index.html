<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Survey Reject</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#4f46e5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
width:400px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#2563eb;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.btn{
display:block;
width:100%;
padding:12px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
margin-top:15px;
}

.btn:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<div class="login-box">

<h1>Survey Reject</h1>

<p>Please login to continue</p>

<input type="text" placeholder="Enter your name">

<input type="email" placeholder="Enter your email">

<a href="home.html" class="btn">Login</a>

</div>

</body>
</html>
