<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Reject</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#fff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#0f172a;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>Survey Reject</h1>

<p>Find survey companies that may have higher rejection reports from users.</p>

<form action="surveys.html">

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Email Address" required>

<button type="submit">Enter Website</button>

</form>

<div class="footer">

Made with ❤️ for Survey Users

</div>

</div>

</body>
</html>
