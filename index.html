<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Survey Reject</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:0;
}

.box{
    width:350px;
    background:white;
    margin:120px auto;
    padding:30px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h1{
    color:#222;
}

input{
    width:90%;
    padding:12px;
    margin:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:95%;
    padding:12px;
    background:#222;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#444;
}

#welcome{
    display:none;
}
</style>

</head>

<body>


<div class="box" id="login">

<h1>SURVEY REJECT</h1>

<p>Enter your details to continue</p>

<input id="name" placeholder="Your Name">

<input id="email" placeholder="Your Email">

<button onclick="login()">Continue</button>

</div>



<div class="box" id="welcome">

<h1>Welcome 👋</h1>

<h2 id="username"></h2>

<p>
Find surveys that are not recommended
and avoid wasting your time.
</p>

<button onclick="goSurvey()">Go To Survey List</button>

</div>



<script>

function login(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;


if(name=="" || email==""){
alert("Please enter your name and email");
return;
}


localStorage.setItem("username",name);
localStorage.setItem("useremail",email);


showWelcome();

}



function showWelcome(){

let name=localStorage.getItem("username");

document.getElementById("login").style.display="none";

document.getElementById("welcome").style.display="block";

document.getElementById("username").innerHTML="Welcome, "+name;

}



function goSurvey(){

window.location="survey-list.html";

}



// Check previous user

if(localStorage.getItem("username")){

showWelcome();

}


</script>


</body>
</html>
