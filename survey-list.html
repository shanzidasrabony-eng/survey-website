<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survey List - SurveyGPT Check</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#333;
}


/* HEADER */

header{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:28px;
}

header p{
    font-size:14px;
}


/* SEARCH */

.search-box{
    width:95%;
    max-width:900px;
    margin:25px auto;
}

.search-box input{
    width:100%;
    padding:14px;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:8px;
}


/* SURVEY LIST */

.survey-list{
    width:95%;
    max-width:900px;
    margin:auto;
}


.survey-item{

    background:white;
    padding:15px 20px;
    margin-bottom:10px;
    border-radius:10px;

    display:flex;
    align-items:center;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    transition:.3s;
}


.survey-item:hover{
    background:#eef5ff;
}


.rank{

    width:50px;
    font-weight:bold;
    color:#2563eb;

}


.company{

    flex:1;
    font-size:16px;

}


.count{

    color:#555;

}


/* FOOTER */

footer{

    margin-top:40px;
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;

}


</style>

</head>


<body>


<header>

<h1>Survey List</h1>

<p>Check Surveys. Save Time.</p>

</header>



<div class="search-box">

<input type="text" id="search" placeholder="Search Survey Company..." onkeyup="searchSurvey()">

</div>



<div class="survey-list" id="list">


<div class="survey-item">
<span class="rank">1</span>
<span class="company">WALR</span>
<span class="count">25</span>
</div>


<div class="survey-item">
<span class="rank">2</span>
<span class="company">Potentia Insight Limited</span>
<span class="count">22</span>
</div>


<div class="survey-item">
<span class="rank">3</span>
<span class="company">Savanta</span>
<span class="count">18</span>
</div>


<div class="survey-item">
<span class="rank">4</span>
<span class="company">Appinio</span>
<span class="count">16</span>
</div>


<div class="survey-item">
<span class="rank">5</span>
<span class="company">Walnut Unlimited</span>
<span class="count">14</span>
</div>


<div class="survey-item">
<span class="rank">6</span>
<span class="company">Research Clever Ltd</span>
<span class="count">10</span>
</div>


<div class="survey-item">
<span class="rank">7</span>
<span class="company">Verian</span>
<span class="count">8</span>
</div>


<div class="survey-item">
<span class="rank">8</span>
<span class="company">Ipsos</span>
<span class="count">7</span>
</div>


<div class="survey-item">
<span class="rank">9</span>
<span class="company">YouGov</span>
<span class="count">5</span>
</div>


</div>



<footer>

SurveyGPT Check © 2026

</footer>



<script>


function searchSurvey(){

let input=document.getElementById("search").value.toLowerCase();

let items=document.getElementsByClassName("survey-item");


for(let i=0;i<items.length;i++){

let text=items[i].innerText.toLowerCase();


if(text.includes(input)){

items[i].style.display="flex";

}else{

items[i].style.display="none";

}

}


}


</script>



</body>
</html>
