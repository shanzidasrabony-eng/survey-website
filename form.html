<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Form</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#4f46e5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
width:420px;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#2563eb;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

.radio-group{
text-align:left;
margin:15px 0;
}

.radio-group label{
display:block;
margin:8px 0;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

.next-btn{
display:block;
margin-top:15px;
background:#16a34a;
color:white;
text-decoration:none;
padding:12px;
border-radius:8px;
}

.next-btn:hover{
background:#15803d;
}
</style>

</head>

<body>

<div class="container">

<h1>Survey Form</h1>

<p>Please fill in the information below.</p>

<input type="text" placeholder="Enter your name">

<input type="email" placeholder="Enter your email">

<div class="radio-group">
<b>How satisfied are you?</b>

<label><input type="radio" name="rating"> Excellent</label>
<label><input type="radio" name="rating"> Good</label>
<label><input type="radio" name="rating"> Average</label>
<label><input type="radio" name="rating"> Poor</label>

</div>

<button>Submit Survey</button>

<a class="next-btn" href="surveys.html">Next → Survey List</a>

</div>

</body>
</html>
